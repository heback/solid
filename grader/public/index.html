<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLID 평가 답안 제출</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SOLID 평가 답안 제출</h1>
  <div id="user" hidden><span id="who"></span><button id="logout" type="button" class="ghost">로그아웃</button></div>
</header>

<main id="login" hidden>
  <p>학교 계정(<b>@ts.hs.kr</b>)으로 로그인하세요.</p>
  <button id="loginBtn" type="button">Google로 로그인</button>
  <p id="loginMsg" class="err" role="alert"></p>
</main>

<main id="app" hidden>
  <section id="drop" tabindex="0">
    <p><b>평가 화면에서 저장한 답안 파일(JSON)</b>을 여기에 끌어 놓거나 <label class="link">파일 선택<input id="pick" type="file" accept="application/json,.json" hidden></label>하세요.</p>
    <p class="note">파일은 평가 화면 아래쪽 <b>💾 JSON 저장</b>으로 만듭니다(파일 이름 예: <code>exam_학번_성명.json</code>). 다시 제출하면 이전 제출을 덮어쓰고, 이미 받은 채점 결과는 사라집니다.</p>
    <p id="msg" class="note" role="status"></p>
  </section>

  <h2 style="font-size:1.05rem;margin:22px 0 8px">내 제출 현황</h2>
  <table id="status">
    <thead><tr><th>학번·성명</th><th>제출일시</th><th>채점 여부</th><th>피드백 보고서</th></tr></thead>
    <tbody><tr><td colspan="4" class="mute">아직 제출한 답안이 없습니다.</td></tr></tbody>
  </table>
  <p class="note">채점이 끝나고 선생님이 피드백을 보내면 '채점 완료'로 바뀌고 보고서 링크가 나타납니다.</p>
</main>
<script type="module" src="student.js"></script>
</body>
</html>
